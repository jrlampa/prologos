services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "3000"
      ML_SERVICE_URL: "http://ml:8001"
      FASTAPI_BASE_URL: "http://fastapi:8000"
      SQLITE_PATH: "/data/prologos_mvp.db"
      # Ajuste em prod:
      # GROQ_API_KEY: "..."
      # CORS_ORIGINS: "https://seu-dominio.com"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/prologos_mvp.db:/data/prologos_mvp.db
    # Se você não subir o profile "ml", a API ainda funciona (só não chama ML).

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8000"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "sqlite:////data/prologos_mvp.db"
      # Ajuste em prod:
      # DATAJUD_API_KEY: "..."
    ports:
      - "8000:8000"
    volumes:
      - ./backend/prologos_mvp.db:/data/prologos_mvp.db
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    environment:
      REDIS_URL: "redis://redis:6379/0"
      # Ajuste em prod:
      # DATAJUD_API_KEY: "..."
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"

