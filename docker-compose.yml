services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "3000"
      ML_SERVICE_URL: "http://ml:8001"
    ports:
      - "3000:3000"
    # Se você não subir o profile "ml", a API ainda funciona (só não chama ML).

  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"

